services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-challenge}
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-challenge} -d ${POSTGRES_DB:-challenge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - challenge

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://challenge:challenge@postgres:5432/challenge?sslmode=disable}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:15173}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - challenge

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18000}
    ports:
      - "${FRONTEND_PORT:-15173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - challenge

  adminer:
    image: adminer:4.17.1
    ports:
      - "${ADMINER_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - challenge

  dbmate:
    image: amacneil/dbmate:2.34
    env_file:
      - dbmate.env
    volumes:
      - ./database/migrations:/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - challenge
    profiles:
      - tools

  faker:
    build:
      context: ./faker
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://challenge:challenge@postgres:5432/challenge?sslmode=disable}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - challenge
    profiles:
      - tools

volumes:
  database:
  frontend_node_modules:

networks:
  challenge:
    name: cc_challenge
